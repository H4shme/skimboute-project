<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkimBot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap');

:root {
  --bg:      #080c10;
  --bg2:     #0d1219;
  --bg3:     #141c26;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --text:    #e8eef8;
  --muted:   #4a5568;
  --accent:  #00e5b0;
  --blue:    #2196f3;
  --warn:    #ffaa00;
  --danger:  #ff3344;
  --lamp:    #ffd54f;
  --mono:    'Share Tech Mono', monospace;
  --sans:    'Barlow Condensed', sans-serif;
  --h:       100dvh;
  --safe-l:  env(safe-area-inset-left, 0px);
  --safe-r:  env(safe-area-inset-right, 0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:var(--h);
  background:var(--bg);color:var(--text);
  font-family:var(--sans);
  overflow:hidden;
  touch-action:none;
}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.18) 2px,rgba(0,0,0,0.18) 4px);
}

#app{
  position:relative;z-index:1;
  width:100%;height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"top" "main" "bot";
}

/* ════════════════ TOPBAR ════════════════ */
#topbar{
  grid-area:top;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 14px 6px calc(14px + var(--safe-l));
  padding-right:calc(14px + var(--safe-r));
  border-bottom:1px solid var(--border);
  background:var(--bg);
  gap:12px;
}
.brand{font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;}
.brand em{color:var(--accent);font-style:normal;}

/* ── BLE ROW ── */
#ble-row{display:flex;align-items:center;gap:8px;flex:1;}

/* Bluetooth icon button */
#ble-scan-btn{
  display:flex;align-items:center;gap:7px;
  padding:6px 12px;border-radius:6px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--muted);
  font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  flex-shrink:0;
}
#ble-scan-btn svg{width:14px;height:14px;flex-shrink:0;}
#ble-scan-btn.scanning{border-color:var(--blue);color:var(--blue);background:rgba(33,150,243,.08);}
#ble-scan-btn.connected{border-color:var(--accent);color:var(--accent);background:rgba(0,229,176,.08);}

/* Device name pill */
#ble-device-name{
  flex:1;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:11px;color:var(--text);
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:6px;padding:5px 10px;
  display:none;
}
#ble-device-name.show{display:block;}

/* Signal strength */
#ble-rssi{
  font-family:var(--mono);font-size:10px;color:var(--muted);
  display:none;align-items:center;gap:4px;flex-shrink:0;
}
#ble-rssi.show{display:flex;}
.rssi-bars{display:flex;align-items:flex-end;gap:2px;height:14px;}
.rssi-bar{width:3px;border-radius:1px;background:var(--muted);}
.rssi-bar.lit{background:var(--accent);}
.rssi-bar:nth-child(1){height:4px;}
.rssi-bar:nth-child(2){height:7px;}
.rssi-bar:nth-child(3){height:10px;}
.rssi-bar:nth-child(4){height:14px;}

.conn-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.conn-dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.4s infinite;}
.conn-dot.scanning{background:var(--blue);box-shadow:0 0 8px var(--blue);animation:blink .6s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* BLE not supported banner */
#ble-unsupported{
  display:none;
  font-size:11px;color:var(--warn);font-family:var(--mono);
  padding:4px 8px;border:1px solid var(--warn);border-radius:4px;
  background:rgba(255,170,0,.06);white-space:nowrap;
}

.top-sensors{display:flex;gap:10px;align-items:center;}
.top-hum{display:flex;flex-direction:column;align-items:center;gap:1px;}
.top-hum-label{font-size:9px;color:var(--muted);letter-spacing:.5px;}
.top-hum-val{font-family:var(--mono);font-size:14px;color:var(--accent);}
.top-hum-val.alert-val{color:var(--danger);}
.top-pres{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--border2);color:var(--muted);letter-spacing:.5px;}
.top-pres.detected{border-color:var(--warn);color:var(--warn);background:rgba(255,170,0,.08);}

/* ════════════════ MAIN GRID ════════════════ */
#main{
  grid-area:main;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:0;
  overflow:hidden;
}

.panel{
  padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;
  border-right:1px solid var(--border);
  overflow:hidden;
}
.panel:last-child{border-right:none;}
.panel-title{
  font-size:9px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);
  padding-bottom:6px;border-bottom:1px solid var(--border);
}

#panel-left{padding-right:calc(12px + var(--safe-l));}
#panel-right{padding-right:calc(12px + var(--safe-r));}

.motor-wrap{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:8px;}

.motor-pct-big{
  font-family:var(--mono);font-size:52px;line-height:1;
  color:var(--accent);letter-spacing:-2px;
  text-shadow:0 0 30px rgba(0,229,176,.3);
}
.motor-pct-big.zero{color:var(--muted);text-shadow:none;}

.motor-rpm{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:-4px;}
.motor-rpm span{color:var(--text);}

.vbar-wrap{
  flex:1;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--bg3);border-radius:6px;
  overflow:hidden;position:relative;min-height:60px;
  border:1px solid var(--border);
}
.vbar-fill{
  width:100%;background:linear-gradient(180deg,var(--accent),rgba(0,229,176,.3));
  transition:height .25s ease;border-radius:4px;
}
.vbar-ticks{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:2px 0;pointer-events:none;
}
.vbar-tick{
  width:100%;display:flex;align-items:center;
  font-size:8px;color:rgba(255,255,255,.15);font-family:var(--mono);
  padding:0 4px;
}
.vbar-tick::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06);margin-left:4px;}

.motor-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mbtn{
  height:52px;border-radius:8px;
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);font-size:30px;font-weight:300;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;transition:all .1s;
  -webkit-user-select:none;
}
.mbtn:active,.mbtn.pressing{background:var(--accent);color:var(--bg);border-color:var(--accent);transform:scale(.95);}
.mbtn.disabled{opacity:.25;pointer-events:none;}

.motor-stop{
  height:36px;border-radius:6px;border:1px solid var(--border2);
  background:transparent;color:var(--muted);
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:1.5px;
  cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.motor-stop:active{border-color:var(--warn);color:var(--warn);}

#panel-center{
  width:140px;
  display:flex;flex-direction:column;gap:8px;
  padding:10px 10px;
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}

#estop{
  width:100%;padding:14px 8px;
  background:rgba(255,51,68,.1);
  border:2px solid var(--danger);border-radius:10px;
  color:var(--danger);font-family:var(--sans);
  font-size:13px;font-weight:900;letter-spacing:2px;
  text-transform:uppercase;cursor:pointer;
  transition:all .15s;line-height:1.2;text-align:center;
}
#estop:active{background:var(--danger);color:#fff;transform:scale(.97);}
#estop-flash{animation:estop-anim .08s;}
@keyframes estop-anim{0%,100%{background:rgba(255,51,68,.1);}50%{background:var(--danger);}}

.lamp-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg3);border-radius:8px;padding:8px 10px;
  border:1px solid var(--border);cursor:pointer;
  transition:all .2s;
}
.lamp-row.on{border-color:var(--lamp);background:rgba(255,213,79,.06);}
.lamp-ico{font-size:20px;}
.lamp-info{flex:1;padding-left:8px;}
.lamp-name{font-size:11px;font-weight:700;letter-spacing:.5px;}
.lamp-sub{font-size:9px;color:var(--muted);font-family:var(--mono);}
.lamp-row.on .lamp-sub{color:var(--lamp);}

.pres-mini{display:flex;flex-direction:column;gap:4px;}
.pres-mini-item{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;border-radius:6px;
  background:var(--bg3);border:1px solid var(--border);
  font-size:11px;color:var(--muted);font-family:var(--mono);
}
.pres-mini-item.det{border-color:var(--warn);color:var(--warn);background:rgba(255,170,0,.06);}
.pres-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.pres-mini-item.det .pres-dot{background:var(--warn);box-shadow:0 0 6px var(--warn);}

#botbar{
  grid-area:bot;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 14px;
  padding-left:calc(14px + var(--safe-l));
  padding-right:calc(14px + var(--safe-r));
  border-top:1px solid var(--border);
  background:var(--bg2);
  font-family:var(--mono);font-size:10px;color:var(--muted);
  gap:12px;
}
#log-strip{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.log-ok{color:var(--accent);}
.log-warn{color:var(--warn);}
.log-err{color:var(--danger);}
.log-info{color:var(--blue);}
#ts-label{flex-shrink:0;}

#alertOverlay{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(255,51,68,.15);backdrop-filter:blur(3px);
  justify-content:center;align-items:center;
  animation:flashBg 1s infinite;
}
#alertOverlay.show{display:flex;}
@keyframes flashBg{0%,100%{background:rgba(255,51,68,.18);}50%{background:rgba(255,51,68,.06);}}
.alert-card{
  background:#110810;border:1px solid var(--danger);border-radius:14px;
  padding:24px 28px;max-width:360px;width:90%;text-align:center;
}
.alert-title{font-size:20px;font-weight:900;color:var(--danger);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.alert-msg{font-size:13px;color:#ffaab0;font-family:var(--mono);line-height:1.6;margin-bottom:18px;white-space:pre-wrap;}
.alert-dismiss{
  background:var(--danger);color:#fff;border:none;border-radius:8px;
  padding:11px 28px;font-family:var(--sans);font-size:14px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;
}

.dpad{width:100%;}
.dpad-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:5px;aspect-ratio:1;
}
.dpad-btn{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:8px;color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:all .1s;
}
.dpad-btn:active,.dpad-btn.pressing{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.dpad-stop{font-size:14px;}
.dpad-stop:active,.dpad-stop.pressing{background:var(--warn);color:var(--bg);border-color:var(--warn);}

.need-conn{opacity:.3;pointer-events:none;transition:opacity .3s;}

/* ── SCANNING PULSE on brand ── */
@keyframes scan-pulse{
  0%,100%{text-shadow:0 0 8px rgba(33,150,243,0);}
  50%{text-shadow:0 0 18px rgba(33,150,243,.7);}
}
.brand.scanning-anim em{animation:scan-pulse .6s infinite;}
</style>
</head>
<body>

<div id="alertOverlay">
  <div class="alert-card">
    <div class="alert-title">⚠ Alerte Humidité</div>
    <div class="alert-msg" id="alertMsg">—</div>
    <button class="alert-dismiss" onclick="dismissAlert()">Acquitter</button>
  </div>
</div>

<div id="app">

  <!-- ═══ TOPBAR ═══ -->
  <div id="topbar">
    <div class="brand" id="brand">Skim<em>Bot</em></div>

    <!-- BLE CONNECTION ROW -->
    <div id="ble-row">

      <!-- Not supported warning -->
      <div id="ble-unsupported">BT indisponible</div>

      <!-- Scan / Connect button -->
      <button id="ble-scan-btn" onclick="bleConnect()">
        <!-- Bluetooth SVG icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/>
        </svg>
        <span id="ble-btn-label">Connecter</span>
      </button>

      <!-- Device name pill (shown after pairing) -->
      <div id="ble-device-name" title="Appareil connecté">—</div>

      <!-- RSSI bars -->
      <div id="ble-rssi">
        <div class="rssi-bars">
          <div class="rssi-bar" id="rssi1"></div>
          <div class="rssi-bar" id="rssi2"></div>
          <div class="rssi-bar" id="rssi3"></div>
          <div class="rssi-bar" id="rssi4"></div>
        </div>
      </div>

      <div class="conn-status">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-label">Déco.</span>
      </div>
    </div>

    <div class="top-sensors">
      <div class="top-hum"><div class="top-hum-label">HUM 1</div><div class="top-hum-val" id="th0">—</div></div>
      <div class="top-hum"><div class="top-hum-label">HUM 2</div><div class="top-hum-val" id="th1">—</div></div>
      <div class="top-hum"><div class="top-hum-label">HUM 3</div><div class="top-hum-val" id="th2">—</div></div>
      <div class="top-hum"><div class="top-hum-label">HUM 4</div><div class="top-hum-val" id="th3">—</div></div>
      <div class="top-pres" id="tp0">P1</div>
      <div class="top-pres" id="tp1">P2</div>
    </div>
  </div>

  <!-- ═══ MAIN ═══ -->
  <div id="main">

    <!-- LEFT — MOTEUR GAUCHE -->
    <div class="panel" id="panel-left">
      <div class="panel-title">◀ Moteur Gauche</div>
      <div class="motor-wrap need-conn" id="motor-L-wrap">
        <div style="display:flex;align-items:flex-end;gap:12px;">
          <div class="motor-pct-big zero" id="pctL">0<span style="font-size:22px;color:var(--muted)">%</span></div>
          <div><div class="motor-rpm">RPM: <span id="rpmL">—</span></div></div>
        </div>
        <div class="vbar-wrap">
          <div class="vbar-fill" id="vbarL" style="height:0%"></div>
          <div class="vbar-ticks">
            <div class="vbar-tick">100</div>
            <div class="vbar-tick">75</div>
            <div class="vbar-tick">50</div>
            <div class="vbar-tick">25</div>
            <div class="vbar-tick">0</div>
          </div>
        </div>
        <div class="motor-btns">
          <button class="mbtn" id="btnLm"
            ontouchstart="startHold(event,'L',-5)" ontouchend="stopHold(event)"
            onmousedown="startHold(event,'L',-5)" onmouseup="stopHold(event)">−</button>
          <button class="mbtn" id="btnLp"
            ontouchstart="startHold(event,'L',5)" ontouchend="stopHold(event)"
            onmousedown="startHold(event,'L',5)" onmouseup="stopHold(event)">+</button>
        </div>
        <button class="motor-stop" onclick="stopMotor('L')">Stop L</button>
      </div>
    </div>

    <!-- CENTER -->
    <div id="panel-center">
      <div class="panel-title" style="text-align:center">Contrôle</div>
      <button id="estop" onclick="emergencyStop()">ARRÊT<br>URGENCE</button>

      <div class="dpad need-conn" id="dpad">
        <div class="dpad-grid">
          <div></div>
          <button class="dpad-btn"
            ontouchstart="startDir(event,'avancer')" ontouchend="stopDir(event)"
            onmousedown="startDir(event,'avancer')" onmouseup="stopDir(event)">▲</button>
          <div></div>
          <button class="dpad-btn"
            ontouchstart="startDir(event,'gauche')" ontouchend="stopDir(event)"
            onmousedown="startDir(event,'gauche')" onmouseup="stopDir(event)">◀</button>
          <button class="dpad-btn dpad-stop"
            ontouchstart="sendDir('stop')" ontouchend=""
            onmousedown="sendDir('stop')">■</button>
          <button class="dpad-btn"
            ontouchstart="startDir(event,'droite')" ontouchend="stopDir(event)"
            onmousedown="startDir(event,'droite')" onmouseup="stopDir(event)">▶</button>
          <div></div>
          <button class="dpad-btn"
            ontouchstart="startDir(event,'reculer')" ontouchend="stopDir(event)"
            onmousedown="startDir(event,'reculer')" onmouseup="stopDir(event)">▼</button>
          <div></div>
        </div>
      </div>

      <div class="lamp-row need-conn" id="lampRow" onclick="toggleLamp()">
        <div class="lamp-ico">💡</div>
        <div class="lamp-info">
          <div class="lamp-name">Lampe</div>
          <div class="lamp-sub" id="lampSub">Éteinte</div>
        </div>
      </div>

      <div class="pres-mini need-conn">
        <div class="pres-mini-item" id="pmi0">
          <div class="pres-dot"></div><span id="pmiLabel0">Présence 1 — Aucune</span>
        </div>
        <div class="pres-mini-item" id="pmi1">
          <div class="pres-dot"></div><span id="pmiLabel1">Présence 2 — Aucune</span>
        </div>
      </div>
    </div>

    <!-- RIGHT — MOTEUR DROIT -->
    <div class="panel" id="panel-right">
      <div class="panel-title">▶ Moteur Droit</div>
      <div class="motor-wrap need-conn" id="motor-R-wrap">
        <div style="display:flex;align-items:flex-end;gap:12px;">
          <div class="motor-pct-big zero" id="pctR">0<span style="font-size:22px;color:var(--muted)">%</span></div>
          <div><div class="motor-rpm">RPM: <span id="rpmR">—</span></div></div>
        </div>
        <div class="vbar-wrap">
          <div class="vbar-fill" id="vbarR" style="height:0%"></div>
          <div class="vbar-ticks">
            <div class="vbar-tick">100</div>
            <div class="vbar-tick">75</div>
            <div class="vbar-tick">50</div>
            <div class="vbar-tick">25</div>
            <div class="vbar-tick">0</div>
          </div>
        </div>
        <div class="motor-btns">
          <button class="mbtn" id="btnRm"
            ontouchstart="startHold(event,'R',-5)" ontouchend="stopHold(event)"
            onmousedown="startHold(event,'R',-5)" onmouseup="stopHold(event)">−</button>
          <button class="mbtn" id="btnRp"
            ontouchstart="startHold(event,'R',5)" ontouchend="stopHold(event)"
            onmousedown="startHold(event,'R',5)" onmouseup="stopHold(event)">+</button>
        </div>
        <button class="motor-stop" onclick="stopMotor('R')">Stop R</button>
      </div>
    </div>

  </div>

  <!-- ═══ BOTBAR ═══ -->
  <div id="botbar">
    <div id="log-strip">[--:--:--] SkimBot — en attente de connexion…</div>
    <div id="ts-label">—:—:—</div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════
//  BLE CONFIG — adapte ces UUIDs à ton module
// ════════════════════════════════════════════════
const BLE_SERVICE_UUID      = '0000ffe0-0000-1000-8000-00805f9b34fb';
const BLE_CHAR_TX_UUID      = '0000ffe1-0000-1000-8000-00805f9b34fb'; // app → Pi (write)
const BLE_CHAR_RX_UUID      = '0000ffe1-0000-1000-8000-00805f9b34fb'; // Pi → app (notify) — souvent même UUID sur HM-10

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let bleDevice     = null;
let bleServer     = null;
let bleCharTx     = null;
let bleCharRx     = null;
let connected     = false;
let lampOn        = false;
let motorVals     = { L: 0, R: 0 };
let holdTimer     = null;
let alertActive   = false;
let rssiTimer     = null;
let rxBuffer      = '';
const thresholds  = [80, 80, 80, 80];

// ════════════════════════════════════════════════
//  INIT — check Web Bluetooth
// ════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  if (!navigator.bluetooth) {
    document.getElementById('ble-unsupported').style.display = 'block';
    document.getElementById('ble-scan-btn').style.display    = 'none';
    log('Web Bluetooth non supporté — utilise Chrome/Edge sur Android', 'err');
  }
});

// ════════════════════════════════════════════════
//  BLUETOOTH CONNECT / DISCONNECT
// ════════════════════════════════════════════════
async function bleConnect() {
  if (connected) { bleDisconnect(); return; }

  const btn = document.getElementById('ble-scan-btn');
  const lbl = document.getElementById('ble-btn-label');
  const dot = document.getElementById('conn-dot');

  // Scanning state
  btn.classList.add('scanning');
  dot.classList.add('scanning');
  lbl.textContent = 'Scan…';
  document.getElementById('brand').classList.add('scanning-anim');
  document.getElementById('conn-label').textContent = 'Recherche…';
  log('Recherche Bluetooth…', 'info');

  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BLE_SERVICE_UUID] }],
      // Fallback: acceptAllDevices si le filtre ne trouve rien
      // acceptAllDevices: true,
      // optionalServices: [BLE_SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);

    log('Connexion à ' + bleDevice.name + '…', 'info');
    bleServer = await bleDevice.gatt.connect();

    const service = await bleServer.getPrimaryService(BLE_SERVICE_UUID);

    // TX : écriture vers le Pi
    bleCharTx = await service.getCharacteristic(BLE_CHAR_TX_UUID);

    // RX : notifications depuis le Pi
    try {
      bleCharRx = await service.getCharacteristic(BLE_CHAR_RX_UUID);
      await bleCharRx.startNotifications();
      bleCharRx.addEventListener('characteristicvaluechanged', onBleData);
    } catch(e) {
      log('Notify non dispo, mode envoi seul', 'warn');
    }

    onBleConnected();

  } catch(e) {
    bleReset();
    if (e.name !== 'NotFoundError') { // utilisateur a annulé → pas d'erreur
      log('Erreur BLE: ' + e.message, 'err');
    } else {
      log('Scan annulé.', 'warn');
    }
  }
}

function bleDisconnect() {
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
}

function onBleConnected() {
  connected = true;
  const btn = document.getElementById('ble-scan-btn');
  const lbl = document.getElementById('ble-btn-label');
  const dot = document.getElementById('conn-dot');
  const namePill = document.getElementById('ble-device-name');

  btn.classList.remove('scanning');
  btn.classList.add('connected');
  dot.classList.remove('scanning');
  dot.classList.add('on');
  lbl.textContent = 'Déconnecter';
  document.getElementById('conn-label').textContent = 'Connecté';
  document.getElementById('brand').classList.remove('scanning-anim');

  namePill.textContent = bleDevice.name || 'SkimBot BLE';
  namePill.classList.add('show');

  document.getElementById('ble-rssi').classList.add('show');
  startRssiPolling();

  document.querySelectorAll('.need-conn').forEach(el => el.classList.remove('need-conn'));
  log('Connecté à ' + (bleDevice.name || 'appareil BLE'), 'ok');
}

function onBleDisconnected() {
  bleReset();
  log('Connexion BLE perdue.', 'err');
  // Auto-reconnect attempt
  if (bleDevice) {
    log('Tentative de reconnexion…', 'warn');
    setTimeout(() => {
      if (bleDevice && !connected) {
        bleDevice.gatt.connect()
          .then(server => { bleServer = server; onBleConnected(); })
          .catch(() => log('Reconnexion échouée.', 'err'));
      }
    }, 2000);
  }
}

function bleReset() {
  connected = false;
  bleCharTx = null;
  bleCharRx = null;
  stopRssiPolling();

  const btn = document.getElementById('ble-scan-btn');
  const lbl = document.getElementById('ble-btn-label');
  const dot = document.getElementById('conn-dot');

  btn.classList.remove('scanning','connected');
  dot.classList.remove('on','scanning');
  lbl.textContent = 'Connecter';
  document.getElementById('conn-label').textContent = 'Déco.';
  document.getElementById('brand').classList.remove('scanning-anim');
  document.getElementById('ble-device-name').classList.remove('show');
  document.getElementById('ble-rssi').classList.remove('show');

  ['motor-L-wrap','motor-R-wrap','lampRow','dpad'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.add('need-conn');
  });
  document.querySelectorAll('.pres-mini').forEach(el => el.classList.add('need-conn'));

  document.getElementById('rpmL').textContent = '—';
  document.getElementById('rpmR').textContent = '—';
}

// ════════════════════════════════════════════════
//  RSSI POLLING (indicateur signal)
// ════════════════════════════════════════════════
function startRssiPolling() {
  rssiTimer = setInterval(async () => {
    if (!bleDevice || !connected) return;
    // readRSSI pas encore dans Web BT spec, on simule avec qualité de connexion
    // Sur Android Chrome, bleServer.getPrimaryService ne donne pas RSSI directement.
    // On affiche un état "connecté" fixe (4 barres). Pour RSSI réel, le Pi peut l'envoyer en telemetry.
    setRssi(4);
  }, 3000);
}
function stopRssiPolling() {
  clearInterval(rssiTimer);
  setRssi(0);
}
function setRssi(n) {
  for (let i = 1; i <= 4; i++) {
    const bar = document.getElementById('rssi' + i);
    if (bar) bar.classList.toggle('lit', i <= n);
  }
}

// ════════════════════════════════════════════════
//  SEND via BLE
// ════════════════════════════════════════════════
function sendBLE(obj) {
  if (!bleCharTx || !connected) return;
  const str  = JSON.stringify(obj) + '\n';
  const enc  = new TextEncoder();
  const data = enc.encode(str);
  // BLE max payload = 20 bytes par chunk (MTU standard)
  const chunkSize = 20;
  const send = async () => {
    for (let i = 0; i < data.length; i += chunkSize) {
      const chunk = data.slice(i, i + chunkSize);
      try {
        await bleCharTx.writeValueWithoutResponse(chunk);
      } catch(e) {
        try { await bleCharTx.writeValue(chunk); } catch(_) {}
      }
    }
  };
  send().catch(e => log('Envoi BLE erreur: ' + e.message, 'err'));
}

// ════════════════════════════════════════════════
//  RECEIVE via BLE notify
// ════════════════════════════════════════════════
function onBleData(event) {
  const dec   = new TextDecoder();
  const chunk = dec.decode(event.target.value);
  rxBuffer   += chunk;
  // Parse lignes complètes
  const lines = rxBuffer.split('\n');
  rxBuffer    = lines.pop(); // garder fragment incomplet
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    try { applyTelemetry(JSON.parse(line)); } catch(_) {}
  });
}

// ════════════════════════════════════════════════
//  TELEMETRY
// ════════════════════════════════════════════════
function applyTelemetry(d) {
  if (d.rpmL !== undefined) document.getElementById('rpmL').textContent = d.rpmL;
  if (d.rpmR !== undefined) document.getElementById('rpmR').textContent = d.rpmR;

  if (d.rssi !== undefined) {
    // Le Pi peut envoyer son RSSI BLE dans la telemetry
    const level = d.rssi > -60 ? 4 : d.rssi > -70 ? 3 : d.rssi > -80 ? 2 : 1;
    setRssi(level);
  }

  if (d.pres) {
    d.pres.forEach((v, i) => {
      const item  = document.getElementById('pmi' + i);
      const lbl   = document.getElementById('pmiLabel' + i);
      const topEl = document.getElementById('tp' + i);
      if (v) {
        item.classList.add('det');
        lbl.textContent = 'Présence ' + (i+1) + ' — DÉTECTÉ';
        topEl.classList.add('detected');
        log('Présence ' + (i+1) + ' détectée', 'warn');
      } else {
        item.classList.remove('det');
        lbl.textContent = 'Présence ' + (i+1) + ' — Aucune';
        topEl.classList.remove('detected');
      }
    });
  }

  if (d.hum) {
    let alerts = [];
    d.hum.forEach((v, i) => {
      const el = document.getElementById('th' + i);
      el.textContent = v + '%';
      if (v >= thresholds[i]) {
        el.classList.add('alert-val');
        alerts.push('Capteur ' + (i+1) + ': ' + v + '% (seuil ' + thresholds[i] + '%)');
      } else {
        el.classList.remove('alert-val');
      }
    });
    if (alerts.length) showAlert(alerts.join('\n'));
  }

  document.getElementById('ts-label').textContent = ts();
}

// ════════════════════════════════════════════════
//  MOTORS
// ════════════════════════════════════════════════
function startHold(e, side, delta) {
  e.preventDefault();
  e.currentTarget.classList.add('pressing');
  stepMotor(side, delta);
  holdTimer = setInterval(() => stepMotor(side, delta), 120);
}
function stopHold(e) {
  if (e) e.currentTarget.classList.remove('pressing');
  clearInterval(holdTimer);
}
function stepMotor(side, delta) {
  motorVals[side] = Math.max(0, Math.min(100, motorVals[side] + delta));
  updateMotorUI(side);
  sendBLE({ type: 'motor', side: side, power: motorVals[side] });
}
function stopMotor(side) {
  motorVals[side] = 0;
  updateMotorUI(side);
  sendBLE({ type: 'motor', side: side, power: 0 });
  log('Moteur ' + side + ' stoppé', 'warn');
}
function updateMotorUI(side) {
  const v = motorVals[side];
  const pctEl = document.getElementById('pct' + side);
  pctEl.innerHTML = v + '<span style="font-size:22px;color:var(--muted)">%</span>';
  pctEl.className = 'motor-pct-big' + (v === 0 ? ' zero' : '');
  document.getElementById('vbar' + side).style.height = v + '%';
}

// ════════════════════════════════════════════════
//  LAMP
// ════════════════════════════════════════════════
function toggleLamp() {
  if (!connected) return;
  lampOn = !lampOn;
  document.getElementById('lampRow').classList.toggle('on', lampOn);
  document.getElementById('lampSub').textContent = lampOn ? 'Allumée' : 'Éteinte';
  sendBLE({ type: 'lamp', state: lampOn ? 1 : 0 });
  log('Lampe ' + (lampOn ? 'allumée' : 'éteinte'), lampOn ? 'ok' : 'info');
}

// ════════════════════════════════════════════════
//  DIRECTION PAD
// ════════════════════════════════════════════════
let dirHoldTimer = null;
function startDir(e, cmd) {
  e.preventDefault();
  e.currentTarget.classList.add('pressing');
  sendDir(cmd);
  dirHoldTimer = setInterval(() => sendDir(cmd), 200);
}
function stopDir(e) {
  e.currentTarget.classList.remove('pressing');
  clearInterval(dirHoldTimer);
  sendDir('stop');
}
function sendDir(cmd) {
  sendBLE({ type: 'direction', cmd: cmd });
  if (cmd !== 'stop') log('Direction → ' + cmd.toUpperCase(), 'ok');
}

// ════════════════════════════════════════════════
//  EMERGENCY STOP
// ════════════════════════════════════════════════
function emergencyStop() {
  motorVals.L = 0; motorVals.R = 0;
  updateMotorUI('L'); updateMotorUI('R');
  sendBLE({ type: 'estop' });
  log('⚠ ARRÊT D\'URGENCE', 'err');
  const btn = document.getElementById('estop');
  btn.style.animation = 'none';
  btn.offsetHeight;
  btn.style.animation = 'estop-anim .08s';
  setTimeout(() => btn.style.animation = '', 200);
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 400]);
}

// ════════════════════════════════════════════════
//  ALERTS
// ════════════════════════════════════════════════
function showAlert(msg) {
  if (alertActive) return;
  alertActive = true;
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('alertOverlay').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
  log('ALERTE: ' + msg.replace('\n', ' | '), 'err');
}
function dismissAlert() {
  alertActive = false;
  document.getElementById('alertOverlay').classList.remove('show');
}

// ════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════
function log(msg, cls) {
  const strip = document.getElementById('log-strip');
  const span  = document.createElement('span');
  span.className   = cls ? 'log-' + cls : '';
  span.textContent = '[' + ts() + '] ' + msg;
  strip.innerHTML  = '';
  strip.appendChild(span);
}
function ts() {
  return [new Date().getHours(), new Date().getMinutes(), new Date().getSeconds()]
    .map(n => String(n).padStart(2,'0')).join(':');
}
setInterval(() => { document.getElementById('ts-label').textContent = ts(); }, 1000);
</script>
